<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Påmelding – Ingrid &amp; Herman</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/paamelding.css" />
  <link rel="stylesheet" href="css/passord.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body class="form-page">

  <!-- Passord-overlay -->
  <div class="passord-overlay" id="passordOverlay">
    <div class="passord-kort">
      <img src="images/Monogram_IH_2.png" alt="IH-monogram" class="passord-logo" />
      <h1 class="passord-tittel">
        <img src="images/IngridOgHerman.png?v=2" alt="Ingrid &amp; Herman" class="passord-tittel__img" />
      </h1>
      <p class="passord-tekst">Passordet finner du i bryllupsinvitasjonen</p>
      <div class="passord-felt-wrap">
        <input
          class="passord-felt"
          id="passordFelt"
          type="password"
          placeholder="Kode"
          autocomplete="off"
          autofocus
        />
        <button class="passord-knapp" id="passordKnapp">Gå inn</button>
      </div>
      <p class="passord-feil" id="passordFeil">Feil kode. Prøv igjen.</p>
    </div>
  </div>

  <header class="form-header">
    <a href="index.html" class="form-header__back">← Tilbake</a>
    <p class="form-header__title">Ingrid &amp; Herman · 7. august 2027</p>
  </header>

  <main class="form-main">
    <div class="form-card">

      <!-- Intro -->
      <div class="form-intro">
        <h1 class="section__title">RSVP</h1>
        <p>
          Svarfrist: <strong>1. mars 2027</strong>.
        </p>
      </div>

      <!-- Suksess-melding (skjult til innsending) -->
      <div class="form-success" id="formSuccess" hidden>
        <div class="form-success__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2 6 12 13 22 6"/></svg>
        </div>
        <h2 id="successTitle">Takk for påmeldingen!</h2>
        <p id="successText">Vi gleder oss til å se deg i Loshavn.</p>
        <a href="index.html" class="btn btn--primary">Tilbake til forsiden</a>
      </div>

      <!-- Selve skjemaet -->
      <form class="rsvp-form" id="rsvpForm" novalidate>

        <!-- Navn -->
        <div class="field">
          <label class="field__label" for="name">Ditt / deres fulle navn <span aria-hidden="true">*</span></label>
          <input
            class="field__input"
            type="text"
            id="name"
            name="Navn"
            placeholder="Fornavn Etternavn"
            required
            autocomplete="name"
          />
          <span class="field__error" id="nameError">Vennligst oppgi navn.</span>
        </div>

        <!-- Hotell -->
        <div class="field" data-kun-deltakere>
          <label class="field__checkbox field__checkbox--multiline">
            <input type="checkbox" id="wantsHotel" name="Ønsker hotell" value="Ja" />
            <span class="field__checkbox-label">
              Vi har reservert rom på Rederiet Hotell til 850 kr per natt. Dersom du/dere ønsker å benytte dere av hotelltilbudet, vennligst kryss av.
            </span>
          </label>
        </div>

        <!-- Allergier -->
        <div class="field" data-kun-deltakere>
          <label class="field__label field__label--small" for="allergyDetail">
            Beskriv eventuelle allergier eller preferanser
          </label>
          <textarea
            class="field__textarea"
            id="allergyDetail"
            name="Allergi og preferanser"
            rows="3"
            placeholder="F.eks. glutenallergi, laktoseintoleranse, vegetar …"
          ></textarea>
        </div>

        <!-- Kommentar -->
        <div class="field">
          <label class="field__label field__label--small" for="comment">
            Kommentar (valgfritt)
          </label>
          <textarea
            class="field__textarea"
            id="comment"
            name="Kommentar"
            rows="3"
            placeholder="Andre ting vi bør vite om?"
          ></textarea>
        </div>

        <!-- Kan ikke komme -->
        <div class="field field--avslag">
          <label class="field__checkbox field__checkbox--multiline">
            <input type="checkbox" id="cannotAttend" />
            <span class="field__checkbox-label">
              Jeg / vi har dessverre ikke anledning til å komme
            </span>
          </label>
        </div>

        <button class="btn btn--primary btn--full" type="submit" id="submitBtn">
          Send påmelding
        </button>

        <p class="form-note">* Obligatoriske felt</p>
      </form>

    </div>
  </main>

  <footer class="footer">
    <img src="images/IngridOgHerman.png?v=2" alt="Ingrid &amp; Herman" class="footer__logo" />
    <p>7. august 2027 · Loshavn</p>
  </footer>

  <script src="js/paamelding.js"></script>
  <script src="js/passord.js"></script>
</body>
</html>
